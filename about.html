            user-select: none;

        }
        
        .font-pixel {
            font-family: 'Press Start 2P', monospace;
        }

        /* 8비트 레트로 테두리 스타일 */
        .pixel-corners {
            clip-path: polygon(
                0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0,
                calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px,
                100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%,
                8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px)
            );
        }

        .pixel-btn {
            box-shadow: inset -4px -4px 0px 0px #00000040, inset 4px 4px 0px 0px #ffffff40;
            transition: transform 0.1s ease, filter 0.1s ease;
        }

        .pixel-btn:active {
            transform: translateY(4px);
            box-shadow: inset -2px -2px 0px 0px #00000040, inset 2px 2px 0px 0px #ffffff40;
        }

        /* 카드 뒤집기 애니메이션 */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* 네온 텍스트 효과 */
        .neon-text-pink {
            text-shadow: 0 0 5px #ff007f, 0 0 10px #ff007f, 0 0 20px #ff007f;
        }
        .neon-text-cyan {
            text-shadow: 0 0 5px #00f0ff, 0 0 10px #00f0ff, 0 0 20px #00f0ff;
        }
        .neon-text-yellow {
            text-shadow: 0 0 5px #ffe600, 0 0 10px #ffe600, 0 0 20px #ffe600;
        }

        /* Scanline 효과 (오락실 브라운관 느낌) */
        .scanline {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0.3)
            );
            background-size: 100% 4px;
        }

        /* 반짝이는 픽셀 아케이드 애니메이션 */
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .pixel-blink {
            animation: blink 1s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        /* 역따봉 파티클 낙하 애니메이션 */
        @keyframes thumbsDownFall {
            0% {
                transform: translateY(-20px) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }
        .thumbs-down-particle {
            position: fixed;
            top: -30px;
            z-index: 9999;
            pointer-events: none;
            font-size: 1.8rem;
            animation: thumbsDownFall cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
